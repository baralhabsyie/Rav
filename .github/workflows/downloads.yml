name: update-downloads

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hitung unduhan installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json, datetime
          rel = json.load(open('releases.json'))
          total = 0
          if isinstance(rel, list):
              for r in rel:
                  for a in r.get('assets', []):
                      if a.get('name', '').lower().endswith('.exe'):
                          total += a.get('download_count', 0)
          json.dump({'total': total, 'updated': datetime.datetime.utcnow().isoformat() + 'Z'}, open('downloads.json', 'w'))
          print('total =', total)
          PY
          rm -f releases.json

      - name: Simpan hasil
        run: |
          git config user.name "rav-bot"
          git config user.email "bot@users.noreply.github.com"
          git add downloads.json
          git diff --cached --quiet || (git commit -m "update jumlah unduhan" && git push)
